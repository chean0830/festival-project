spring.config.activate.on-profile=prod

# Behind Caddy's TLS termination: trust X-Forwarded-* so OAuth {baseUrl} and
# redirect URIs are built as https://<domain>, not http://<container>:8080.
server.forward-headers-strategy=framework

# Quieter logs in production.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Real SMTP is configured in prod, so never fall back to logging the reset link.
app.password-reset.log-link=false

# The shared festival.sql owns the schema; only verify mappings against it.
spring.jpa.hibernate.ddl-auto=validate
