spring.application.name=festival-project

# Local MySQL. Keep real passwords in environment variables, not in Git.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/festival?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# The shared SQL file owns the schema. JPA only verifies that Entity mappings match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.password-reset.expiration-minutes=30
# Local development only: when SMTP is not configured, print the reset URL in the backend log.
app.password-reset.log-link=${PASSWORD_RESET_LOG_LINK:true}

# --- 프로필 이미지 업로드 ---
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- 날씨 (OpenWeatherMap) ---
app.weather.api-key=${OPENWEATHER_API_KEY:}
app.weather.base-url=https://api.openweathermap.org/data/2.5

# --- 내 주변 쉼표 (카카오 로컬 API) ---
app.kakao.local-api-key=${KAKAO_LOCAL_API_KEY:}
app.kakao.local-base-url=https://dapi.kakao.com/v2/local

# --- 결제 (Toss Payments) ---
# 사업자등록 없이 쓸 수 있는 Toss 공개 테스트 시크릿 키가 기본값. 실제 서비스 전엔 개인 테스트/운영 키로 교체.
app.payment.toss.secret-key=${TOSS_SECRET_KEY:test_sk_zXLkKEypNArWmo50nX3lmeaxYG5R}

# --- AI 포스터 생성 (Gemini 이미지 모델) ---
# 무료 티어가 없어 호출마다 과금됨. https://aistudio.google.com/apikey 에서 개인 키 발급.
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.image-model=${GEMINI_IMAGE_MODEL:gemini-3.1-flash-lite-image}

# --- AI 일기 생성 (Gemini 텍스트 모델) ---
app.ai.gemini.text-model=${GEMINI_TEXT_MODEL:gemini-3.1-flash-lite}
