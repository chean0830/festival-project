spring.application.name=festival-project

# Local MySQL. Keep real passwords in environment variables, not in Git.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/festival?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# The shared SQL file owns the schema. JPA only verifies that Entity mappings match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.password-reset.expiration-minutes=30
# Local development only: when SMTP is not configured, print the reset URL in the backend log.
app.password-reset.log-link=${PASSWORD_RESET_LOG_LINK:true}

# --- 프로필 이미지 업로드 ---
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- 날씨 (OpenWeatherMap) ---
app.weather.api-key=${OPENWEATHER_API_KEY:}
app.weather.base-url=https://api.openweathermap.org/data/2.5

# --- 내 주변 쉼표 (카카오 로컬 API) ---
app.kakao.local-api-key=${KAKAO_LOCAL_API_KEY:}
app.kakao.local-base-url=https://dapi.kakao.com/v2/local

# --- Redis (오픈채팅 실시간 메시지, 서버 여러 대로 늘어날 때 동기화용) ---
# 로컬에 Redis가 없어도 앱은 그대로 뜨고, 채팅도 지금처럼(로컬 브로커 직접 전송) 동작한다 —
# ChatRedisPublisher가 Redis publish 실패 시 자동으로 그 경로로 대체(fallback)한다.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
