spring.application.name=demo

# --- Database (festival.sql 스키마 기준, 로컬 MySQL 계정에 맞게 필요 시 환경변수로 덮어쓰세요) ---
spring.datasource.url=jdbc:mysql://localhost:3306/festival?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA (테이블은 database/festival.sql로 관리되므로 자동 DDL 변경 금지) ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- 프로필 이미지 업로드 ---
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
