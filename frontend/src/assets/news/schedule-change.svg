<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8ee"/>
      <stop offset="100%" stop-color="#fdeed9"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffab6b"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </linearGradient>
  </defs>

  <rect width="480" height="480" fill="url(#bg)"/>

  <!-- 중앙 원형 아이콘 배지 -->
  <circle cx="240" cy="206" r="66" fill="url(#iconBg)"/>

  <!-- 달력 + 경고 아이콘 -->
  <g transform="translate(240 206)">
    <rect x="-28" y="-24" width="56" height="48" rx="7" fill="#ffffff"/>
    <rect x="-28" y="-24" width="56" height="15" rx="7" fill="#ff8a3d"/>
    <rect x="-28" y="-13" width="56" height="4" fill="#ff8a3d"/>
    <circle cx="-15" cy="-31" r="3" fill="#ffffff"/>
    <circle cx="15" cy="-31" r="3" fill="#ffffff"/>
    <path d="M0 -2 L0 11" stroke="#ff8a3d" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="0" cy="18" r="2.6" fill="#ff8a3d"/>
  </g>

  <!-- 하단 라벨 (공지 문구 강조용 배경 pill) -->
  <rect x="95" y="296" width="290" height="50" rx="25" fill="#241033"/>
  <text x="240" y="329" font-family="IBM Plex Sans KR, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">일정 변경 공지</text>
  <text x="240" y="368" font-family="IBM Plex Mono, monospace" font-size="13" letter-spacing="2.5" fill="#b9752b" text-anchor="middle">FESTLOG NEWS</text>

