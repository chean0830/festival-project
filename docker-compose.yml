# Full stack on one host (Oracle Cloud Always Free VM).
#   cp .env.production.example .env   # then fill in real values
#   docker compose up -d --build
#
# All secrets and host-specific values come from ./.env (git-ignored).

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: festival
    volumes:
      - mysql_data:/var/lib/mysql
      # Schema is loaded once, only when the data volume is empty.
      - ./database/festival.sql:/docker-entrypoint-initdb.d/01-festival.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/festival?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_PROXY_URL: http://ai-proxy:8081
      FRONTEND_URL: https://${APP_DOMAIN}
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  ai-proxy:
    build: ./ai-proxy-server
    restart: unless-stopped
    env_file: .env

  web:
    build:
      context: ./frontend
      args:
        VITE_KAKAO_JS_KEY: ${VITE_KAKAO_JS_KEY}
        VITE_TOSS_CLIENT_KEY: ${VITE_TOSS_CLIENT_KEY}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  uploads:
  caddy_data:
  caddy_config:
